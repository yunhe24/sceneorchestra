[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sceneorchestra"
version = "0.1.0"
description = "Official training, data-generation, and inference code for SceneOrchestra"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{name = "Yun He"}]
dependencies = [
  "torch>=2.4.0",
  "torchvision>=0.19.0",
  "torchaudio>=2.4.0",
  "transformers>=4.51.0,<=4.57.1,!=4.52.0,!=4.57.0",
  "datasets>=2.16.0,<=4.0.0",
  "accelerate>=1.3.0,<=1.11.0",
  "peft>=0.14.0,<=0.17.1",
  "trl>=0.18.0,<=0.24.0",
  "torchdata>=0.10.0,<=0.11.0",
  "gradio>=4.38.0,<=5.50.0",
  "matplotlib>=3.7.0",
  "tyro<0.9.0",
  "einops",
  "numpy",
  "pandas",
  "scipy",
  "sentencepiece",
  "tiktoken",
  "modelscope",
  "hf-transfer",
  "safetensors",
  "av",
  "fire",
  "omegaconf",
  "packaging",
  "protobuf",
  "pyyaml",
  "pydantic",
  "uvicorn",
  "fastapi",
  "sse-starlette",
]

[project.optional-dependencies]
data = ["openai>=1.40"]
dev = ["pytest>=8.0", "ruff>=0.9"]

[project.scripts]
sceneorchestra = "sceneorchestra.cli:main"
llamafactory-cli = "llamafactory.cli:main"
lmf = "llamafactory.cli:main"

[project.urls]
Paper = "https://arxiv.org/abs/2604.19907"
SceneWeaver = "https://github.com/Scene-Weaver/SceneWeaver"
LLaMAFactory = "https://github.com/hiyouga/LLaMA-Factory"

[tool.hatch.build.targets.wheel]
packages = ["src/sceneorchestra", "src/llamafactory"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 119

[tool.ruff.lint]
ignore = ["C408", "C901", "E501", "E731", "E741", "UP007", "UP045", "D100", "D101", "D102", "D103", "D104", "D105", "D107"]
extend-select = ["C", "E", "F", "I", "W", "UP", "D", "PT009", "RUF022"]

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["llamafactory", "sceneorchestra"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["PT009"]

[tool.ruff.lint.pydocstyle]
convention = "google"
