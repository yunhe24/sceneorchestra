<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="SceneOrchestra - ECCV 2026 Poster">
  <title>SceneOrchestra - ECCV 2026 Poster</title>
  <style>
    :root{color-scheme:dark;--blue:#6f9cff;--panel:#151c2c;--line:#303a50}
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{overflow:hidden;background:#0b101b;color:#eef3ff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .toolbar{position:fixed;inset:0 0 auto;z-index:10;height:64px;display:flex;align-items:center;gap:18px;padding:0 22px;background:rgba(17,24,39,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}
    .title{min-width:0;font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .actions{display:flex;gap:9px;margin-left:auto}
    .button{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:8px 14px;border:1px solid #43506a;border-radius:999px;color:#eef3ff;text-decoration:none;font-size:13px;font-weight:750;background:#1d273a}
    .button.primary{background:#2457d6;border-color:#2457d6}
    .stage{position:fixed;inset:64px 0 0;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#253048 0,#111827 55%,#090e18 100%)}
    .preview{display:block;max-width:calc(100% - 34px);max-height:calc(100% - 34px);width:auto;height:auto;object-fit:contain;background:#fff;box-shadow:0 18px 60px rgba(0,0,0,.42);transition:opacity .35s ease}
    iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .35s ease}
    .status{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;align-items:center;gap:9px;padding:8px 13px;border:1px solid rgba(148,163,184,.28);border-radius:999px;background:rgba(15,23,42,.86);box-shadow:0 8px 28px rgba(0,0,0,.26);font-size:12px;color:#d7e1f2;white-space:nowrap}
    .spinner{width:13px;height:13px;border:2px solid rgba(255,255,255,.25);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}
    .pdf-ready iframe{opacity:1;pointer-events:auto}.pdf-ready .preview,.pdf-ready .status{opacity:0;pointer-events:none}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:680px){.toolbar{height:auto;min-height:64px;padding:10px 13px;gap:10px;flex-wrap:wrap}.title{width:100%;font-size:14px}.actions{width:100%;margin:0}.button{flex:1;padding:7px 10px}.stage{inset:112px 0 0}.status{bottom:12px}}
  </style>
</head>
<body>
  <header class="toolbar">
    <div class="title">SceneOrchestra - ECCV 2026 Poster</div>
    <nav class="actions" aria-label="Poster actions">
      <a class="button" href="./">Back to project page</a>
      <a class="button primary" href="poster.pdf?v=20260901-4" target="_blank" rel="noreferrer">Open full-resolution PDF</a>
    </nav>
  </header>
  <main class="stage" id="viewer">
    <img class="preview" src="poster-preview.jpg?v=20260901-1" alt="SceneOrchestra ECCV 2026 poster preview">
    <iframe id="posterFrame" title="SceneOrchestra - ECCV 2026 Poster"></iframe>
    <div class="status" id="status"><span class="spinner" aria-hidden="true"></span><span>Loading full-resolution poster…</span></div>
  </main>
  <script>
    const viewer = document.getElementById('viewer');
    const frame = document.getElementById('posterFrame');
    const status = document.getElementById('status');
    if (window.matchMedia('(min-width: 681px)').matches) {
      frame.addEventListener('load', () => window.setTimeout(() => viewer.classList.add('pdf-ready'), 650), {once:true});
      frame.src = 'poster.pdf?v=20260901-4#view=FitH&navpanes=0';
    } else {
      status.innerHTML = '<span>Preview · use “Open full-resolution PDF” to zoom</span>';
    }
  </script>
</body>
</html>
